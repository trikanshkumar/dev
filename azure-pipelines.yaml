trigger:
  - dev

parameters:
  - name: environment
    displayName: Select environment
    type: string
    default: dev
    values:
      - dev
      - uat
      - prod

variables:
  - group: wwrr-${{ parameters.environment }}-pipeline-password
  - name: agentName
    ${{ if eq(parameters.environment, 'dev') }}:
      value: 'wwrr-dev-agent'
    ${{ if eq(parameters.environment, 'uat') }}:
      value: 'wwrr-uat-agent'
    ${{ if eq(parameters.environment, 'prod') }}:
      value: 'wwrr-prod-agent'

  - name: ALLOYDB_ADMIN_EMAIL
    ${{ if eq(parameters.environment, 'dev') }}:
      value: 'wwrr-mod-admin-alloydb@gcp-cti-wwrr-dev.iam.gserviceaccount.com'
    ${{ if eq(parameters.environment, 'uat') }}:
      value: 'wwrr-mod-admin-alloydb@gcp-cti-wwrr-uat.iam.gserviceaccount.com'
    ${{ if eq(parameters.environment, 'prod') }}:
      value: 'wwrr-mod-admin-alloydb@gcp-cti-wwrr-prod.iam.gserviceaccount.com'

  - name: ALLOYDB_APP_EMAIL
    ${{ if eq(parameters.environment, 'dev') }}:
      value: 'wwrr-mod-app-alloydb@gcp-cti-wwrr-dev.iam.gserviceaccount.com'
    ${{ if eq(parameters.environment, 'uat') }}:
      value: 'wwrr-mod-app-alloydb@gcp-cti-wwrr-uat.iam.gserviceaccount.com'
    ${{ if eq(parameters.environment, 'prod') }}:
      value: 'wwrr-mod-app-alloydb@gcp-cti-wwrr-prod.iam.gserviceaccount.com'

pool:
  name: WWRR Mod Custom Agent Pool

stages:

- stage: Sonar_Analysis
  displayName: Run SonarQube in Kubernetes

  jobs:
  - job: SonarAnalysis
    displayName: Run SonarQube Analysis
    pool:
      name: WWRR Mod Custom Agent Pool
      demands:
        - Agent.Name -equals wwrr-prod-agent

    steps:
    - checkout: self
      persistCredentials: true

    - task: Bash@3
      displayName: Configure GCP
      inputs:
        targetType: inline
        script: |
          set -e
          gcloud config set project gcp-cti-wwrr-prod
          gcloud container clusters get-credentials wwrr-prod-gke-cluster --region $(GCP_REGION) --project gcp-cti-wwrr-prod

    - task: Bash@3
      displayName: Build Sonar Image
      inputs:
        targetType: inline
        script: |
          cat <<EOF > Dockerfile.sonar
          FROM mcr.microsoft.com/dotnet/sdk:8.0
          RUN apt-get update && apt-get install -y curl openjdk-17-jre
          RUN dotnet tool install --global dotnet-sonarscanner
          ENV PATH="$PATH:/root/.dotnet/tools"
          EOF
          SONAR_IMAGE=us-east4-docker.pkg.dev/gcp-cti-wwrr-prod/wwrr-prod-docker-repo/dotnet-sonar:$(Build.BuildId)
          docker build -f Dockerfile.sonar -t $SONAR_IMAGE .
          docker push $SONAR_IMAGE      

    - task: Bash@3
      displayName: Run Sonar in K8s Job
      inputs:
        targetType: inline
        script: |
          set -e

          echo "Packing source code..."
          tar --exclude=app.tar.gz -czf app.tar.gz . || true

          kubectl create namespace wwrr-prod --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job sonar-analysis-$(Build.BuildId) -n wwrr-prod --ignore-not-found

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: sonar-analysis-$(Build.BuildId)
            namespace: wwrr-prod
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                annotations:
                  sidecar.istio.io/inject: "false"
              spec:
                restartPolicy: Never
                hostAliases:
                - ip: "$(SONAR_IP_1)"
                  hostnames:
                  - "sonar.ups.com"
                - ip: "$(SONAR_IP_2)"
                  hostnames:
                  - "sonar.ups.com"
                containers:
                - name: sonar
                  image: us-east4-docker.pkg.dev/gcp-cti-wwrr-prod/wwrr-prod-docker-repo/dotnet-sonar:$(Build.BuildId)
                  env:
                  - name: SONAR_TOKEN
                    value: "$(SONAR_TOKEN)"
                  command: ["/bin/sh","-c"]
                  args:
                  - |
                    echo "Container started..."
                    echo "Waiting for file..."
                    for i in \$(seq 1 60); do
                      if [ -f /tmp/app.tar.gz ]; then
                        SIZE1=\$(stat -c%s /tmp/app.tar.gz)
                        sleep 2
                        SIZE2=\$(stat -c%s /tmp/app.tar.gz)
                        if [ "\$SIZE1" = "\$SIZE2" ]; then
                          echo "File copy completed"
                          break
                        fi
                      fi
                      echo "Waiting for stable file..."
                      sleep 2    
                    done

                    mkdir -p /app
                    tar -xzf /tmp/app.tar.gz -C /app
                    cd /app

                    echo "Testing connectivity..."
                    curl -I https://sonar.ups.com || true
                    curl -I https://api.nuget.org || true

                    echo "Starting Sonar..."
                    java -version
                    dotnet --info
                    dotnet sonarscanner begin /k:"DCT_wwrr-mod-app-data-load_283c95c3-74f2-49e6-aa5a-fb36cc97a13b" /d:sonar.host.url="https://sonar.ups.com/" /d:sonar.token="$SONAR_TOKEN" /d:sonar.branch.name="${{ parameters.environment }}" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.scanner.scanAll=true

                    echo "Configuring JFrog..."
                    dotnet nuget add source https://lucius.ups.com/artifactory/api/nuget/v3/wwrr-mod-app-nuget-dev-virtual \
                      --name jfrog \
                      --username "$(JFROG_USERNAME)" \
                      --password "$(JFROG_ACCESS_TOKEN)" \
                      --store-password-in-clear-text

                    echo "Running restore..."
                    dotnet restore
                    echo "Running build..."
                    dotnet build --no-incremental || exit 1
                    echo "Running tests..."
                    dotnet test --no-build --collect:"XPlat Code Coverage;Format=opencover"
                    dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          EOF

          echo "Waiting for pod..."
          sleep 20
          kubectl wait --for=condition=Ready pod -l job-name=sonar-analysis-$(Build.BuildId) -n wwrr-prod --timeout=180s
          POD_NAME=$(kubectl get pods -n wwrr-prod -l job-name=sonar-analysis-$(Build.BuildId) -o jsonpath="{.items[0].metadata.name}")
          echo "Pod ready: $POD_NAME"

          echo "Copying code..."
          kubectl cp app.tar.gz wwrr-prod/$POD_NAME:/tmp/app.tar.gz

          echo "Streaming logs..."
          kubectl logs -f $POD_NAME -n wwrr-prod -c sonar

          echo "Waiting for completion..."
          kubectl wait --for=condition=complete job/sonar-analysis-$(Build.BuildId) -n wwrr-prod --timeout=1200s

          kubectl logs $POD_NAME -n wwrr-prod -c sonar

  # ================= BUILD & DEPLOY =================

  - job: BuildDeploy
    displayName: Build Image Deploy Run Migration
    pool:
      name: WWRR Mod Custom Agent Pool
      demands:
        - Agent.Name -equals $(agentName)

    steps:
    - checkout: self

    - task: Bash@3
      displayName: Configure GCP
      inputs:
        targetType: inline
        script: |

          set -e
          gcloud config set project $(GCP_PROJECT_ID)
          echo "Using VM service account identity"
          gcloud config set account wwrr-${{ parameters.environment }}-vm-sa@gcp-cti-wwrr-${{ parameters.environment }}.iam.gserviceaccount.com

          gcloud container clusters get-credentials $(GKE_CLUSTER_NAME) \
            --region $(GCP_REGION) \
            --project $(GCP_PROJECT_ID)

    - task: UseDotNet@2
      inputs:
        version: "8.x"

    - task: Bash@3
      displayName: Build EFBundle
      inputs:
        targetType: inline
        script: |

          dotnet restore src/UPS.WWRR.APP/UPS.WWRR.App.csproj --runtime linux-x64
          dotnet restore src/UPS.WWRR.Data/UPS.WWRR.Data.csproj --runtime linux-x64

          BASE_CONNECTION=$(gcloud secrets versions access latest \
            --secret=wwrr-${{ parameters.environment }}-alloydb-admin-conn \
            --project=$(GCP_PROJECT_ID))
          export ALLOYDB_CONNECTION="$BASE_CONNECTION"

          dotnet ef migrations bundle \
            --project src/UPS.WWRR.Data \
            --startup-project src/UPS.WWRR.APP \
            --output efbundle

          chmod +x efbundle

    - task: Bash@3
      displayName: Authenticate Docker
      inputs:
        targetType: inline
        script: |
          gcloud auth configure-docker $(GCP_REGION)-docker.pkg.dev --quiet      

    - task: Bash@3
      displayName: Build EF Migration Image
      inputs:
        targetType: inline
        script: |
          cat <<EOF > Dockerfile.migration
          FROM mcr.microsoft.com/dotnet/aspnet:8.0
          RUN apt-get update \
              && apt-get install -y postgresql-client procps \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY efbundle /app/efbundle
          RUN chmod +x /app/efbundle
          ENTRYPOINT ["/app/efbundle"]
          EOF

          MIGRATION_IMAGE=$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO)/ef-migration
          IMAGE_TAG=$(Build.BuildId)

          docker build -f Dockerfile.migration -t $MIGRATION_IMAGE:$IMAGE_TAG .
          docker push $MIGRATION_IMAGE:$IMAGE_TAG

    - task: Bash@3
      displayName: 'Fetch AlloyDB Secrets'
      inputs:
        targetType: inline
        script: |
          set -e

          echo "Fetching AlloyDB admin connection..."

          BASE_CONNECTION=$(gcloud secrets versions access latest \
            --secret=wwrr-${{ parameters.environment }}-alloydb-admin-conn \
            --project=$(GCP_PROJECT_ID))
          BASE_CONNECTION=$(echo "$BASE_CONNECTION" | sed 's/SslMode=Require/SslMode=Disable/g')

          echo "##vso[task.setvariable variable=ALLOYDB_CONNECTION;issecret=true]$BASE_CONNECTION"   

    - task: Bash@3
      displayName: Run EFBundle (DB Migration) Job
      inputs:
        targetType: inline
        script: |

          MIGRATION_IMAGE=$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO)/ef-migration
          IMAGE_TAG=$(Build.BuildId)

          kubectl delete job efbundle-migration-${{ parameters.environment }}-$(Build.BuildId) \
          -n wwrr-${{ parameters.environment }} --ignore-not-found

          cat <<EOF | kubectl apply -f -

          apiVersion: batch/v1
          kind: Job
          metadata:
            name: efbundle-migration-${{ parameters.environment }}-$(Build.BuildId)
            namespace: wwrr-${{ parameters.environment }}
            annotations:
              sidecar.istio.io/inject: "false" 

          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0

            template:
              metadata:
                annotations:
                  sidecar.istio.io/inject: "false"
              spec:
                restartPolicy: Never
                serviceAccountName: ups-wwrr-batch
                shareProcessNamespace: true

                hostAliases:
                - ip: "$(ALLOYDB_HOST_ALIAS_IP)"
                  hostnames:
                  - "$(ALLOYDB_HOST_ALIAS_NAME)"

                containers:

                - name: ef-runner
                  image: $MIGRATION_IMAGE:$IMAGE_TAG
                  env:
                    - name: ALLOYDB_CONNECTION
                      value: "$(ALLOYDB_CONNECTION)" 
                    - name: GOOGLE_CLOUD_STORAGE_BUCKET_NAME
                      value: "$(GOOGLE_CLOUD_STORAGE_BUCKET_NAME)"  
                    - name: LOAD_INTERVAL_MINUTES
                      value: "$(LOAD_INTERVAL_MINUTES)"
                    - name: TABLE_NAME
                      value: "$(TABLE_NAME)"
                    - name: BATCH_SIZE
                      value: "$(BATCH_SIZE)"
                    - name: ASPNETCORE_ENVIRONMENT
                      value: "$(ASPNETCORE_ENVIRONMENT)"
                    - name: BatchLoad_ChunkSize
                      value: "$(BatchLoad_ChunkSize)"
                    - name: BatchLoad_Delimiter
                      value: "$(BatchLoad_Delimiter)"
                    - name: BatchLoad_HasHeader
                      value: "$(BatchLoad_HasHeader)"
                    - name: EnableIAMTokenAuth
                      value: "$(EnableIAMTokenAuth)"
                    - name: GCS_DOWNLOAD_CHUNK_SIZE
                      value: "$(GCS_DOWNLOAD_CHUNK_SIZE)"
                    - name: TVASYLN_USE_BATCH_MERGE
                      value: "$(TVASYLN_USE_BATCH_MERGE)"
                    - name: TRASTD_USE_BATCH_MERGE
                      value: "$(TRASTD_USE_BATCH_MERGE)"
                    - name: TSUBCHG_USE_BATCH_MERGE
                      value: "$(TSUBCHG_USE_BATCH_MERGE)"
                    - name: Enable_MQ
                      value: "$(Enable_MQ)"   
        

                  command:
                  - /bin/sh
                  - -c
                  - |

                    echo "Waiting for AlloyDB proxy..."

                    until pg_isready -h 127.0.0.1 -p 5432; do
                      echo "Proxy not ready yet..."
                      sleep 2
                    done
                    echo "Proxy is ready!"
                    /app/efbundle --connection "\$ALLOYDB_CONNECTION"
                    echo "Migration finished"

                    pkill -f alloydb-auth-proxy || true

                - name: alloydb-auth-proxy
                  image: gcr.io/alloydb-connectors/alloydb-auth-proxy:1.13.11
                  args:
                    - "projects/$(GCP_PROJECT_ID)/locations/$(GCP_REGION)/clusters/wwrr-${{ parameters.environment }}-alloydb/instances/primary"
                    - "--psc"
                    - "--address=127.0.0.1"
                    - "--port=5432"
                    - "--auto-iam-authn"

          EOF

    - task: Bash@3
      displayName: Migration Logs
      inputs:
        targetType: inline
        script: |

          echo "Waiting for migration pod..."
          sleep 15

          kubectl wait --for=condition=Ready pod \
          -l job-name=efbundle-migration-${{ parameters.environment }}-$(Build.BuildId) \
          -n wwrr-${{ parameters.environment }} \
          --timeout=120s

          kubectl logs -f job/efbundle-migration-${{ parameters.environment }}-$(Build.BuildId) \
          -n wwrr-${{ parameters.environment }} \
          -c ef-runner

    - task: Bash@3
      displayName: Build and Push Docker Image
      inputs:
        targetType: inline
        script: |

          IMAGE_URI=$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO)/$(IMAGE_NAME)
          IMAGE_TAG=$(Build.BuildId)

          docker build -t $IMAGE_URI:$IMAGE_TAG .
          docker push $IMAGE_URI:$IMAGE_TAG

          docker image prune -f

    - task: Bash@3
      displayName: Mirror external images to Artifact Registry
      inputs:
        targetType: inline
        script: |
          set -e

          echo "Authenticating Docker..."
          gcloud auth configure-docker $(GCP_REGION)-docker.pkg.dev --quiet

          echo "Mirroring required images..."

          IMAGES=(
            "ghcr.io/jkroepke/kube-webhook-certgen:1.8.0"
            "ghcr.io/prometheus-operator/prometheus-operator:v0.85.0"
            "ghcr.io/prometheus-operator/prometheus-config-reloader:v0.85.0"

            "quay.io/prometheus/prometheus:v2.52.0"
            "quay.io/prometheus/alertmanager:v0.27.0"
            "quay.io/prometheus/node-exporter:v1.11.1-distroless"

            "grafana/grafana:10.4.2"
            "quay.io/kiali/kiali:v2.24.0"
            "ghcr.io/kiwigrid/k8s-sidecar:2.6.0"
            "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1"
          )

          for IMAGE in "${IMAGES[@]}"; do

            if [[ "$IMAGE" == *"/"*"/"* ]]; then
              IMAGE_PATH=$(echo $IMAGE | sed -E 's|^[^/]+/||')
            else
              IMAGE_PATH=$(echo $IMAGE | cut -d: -f1)
            fi

            IMAGE_NAME="monitoring/$(basename $(echo $IMAGE_PATH | cut -d: -f1))"
            IMAGE_TAG=$(echo $IMAGE | awk -F: '{print $2}')

            TARGET="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO)/${IMAGE_NAME}:${IMAGE_TAG}"

            echo "Processing $IMAGE → $TARGET"

            docker pull $IMAGE
            docker tag $IMAGE $TARGET
            docker push $TARGET

          done   

    - task: Bash@3
      displayName: Deploy to GKE
      inputs:
        targetType: inline
        script: |
          set -e

          RELEASE=ups-wwrr-batch
          NAMESPACE=wwrr-${{ parameters.environment }}

          IMAGE_REPOSITORY=$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO)/$(IMAGE_NAME)

          echo "Checking helm release status..."

          STATUS=$(helm status $RELEASE -n $NAMESPACE -o json 2>/dev/null | jq -r '.info.status' || echo "notfound")

          echo "Helm status: $STATUS"

          # Handle stuck state
          if [[ "$STATUS" == "pending-install" || "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-rollback" ]]; then
            echo "Helm release is stuck. Rolling back to last stable version..."
            sleep 5 
            if helm status $RELEASE -n $NAMESPACE > /dev/null 2>&1; then
              LAST_REVISION=$(helm history $RELEASE -n $NAMESPACE -o json | jq 'map(select(.status=="deployed")) | last(.[]).revision')
            else
              LAST_REVISION=""
            fi

            if [[ "$LAST_REVISION" != "null" && "$LAST_REVISION" != "" ]]; then
              echo "Rolling back to revision $LAST_REVISION"
              helm rollback $RELEASE $LAST_REVISION -n $NAMESPACE
            else
              echo "No stable revision found. Skipping rollback..."
            fi
          fi

          echo "Starting Helm upgrade..."

          helm upgrade --install $RELEASE ./manifests/ups-wwrr-batch \
            --namespace $NAMESPACE \
            --wait \
            --timeout 600s \
            --atomic \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$(Build.BuildId)" \
            --set serviceAccount.annotations."iam\.gke\.io/gcp-service-account"="$(ALLOYDB_ADMIN_EMAIL)" \
            --set-string env.GOOGLE_CLOUD_STORAGE_BUCKET_NAME="$(GOOGLE_CLOUD_STORAGE_BUCKET_NAME)" \
            --set-string env.LOAD_INTERVAL_MINUTES="$(LOAD_INTERVAL_MINUTES)" \
            --set-string env.TABLE_NAME="$(TABLE_NAME)" \
            --set-string env.BATCH_SIZE="$(BATCH_SIZE)" \
            --set-string env.ASPNETCORE_ENVIRONMENT="$(ASPNETCORE_ENVIRONMENT)" \
            --set-string env.ALLOYDB_CONNECTION="$(ALLOYDB_CONNECTION)" \
            --set-string env.EnableIAMTokenAuth="$(EnableIAMTokenAuth)" \
            --set-string env.BatchLoad_ChunkSize="$(BatchLoad_ChunkSize)" \
            --set-string env.BatchLoad_Delimiter="$(BatchLoad_Delimiter)" \
            --set-string env.GCS_DOWNLOAD_CHUNK_SIZE="$(GCS_DOWNLOAD_CHUNK_SIZE)" \
            --set-string env.TVASYLN_USE_BATCH_MERGE="$(TVASYLN_USE_BATCH_MERGE)" \
            --set-string env.TRASTD_USE_BATCH_MERGE="$(TRASTD_USE_BATCH_MERGE)" \
            --set-string env.TSUBCHG_USE_BATCH_MERGE="$(TSUBCHG_USE_BATCH_MERGE)" \
            --set-string env.BatchLoad_HasHeader="$(BatchLoad_HasHeader)" \
            --set-string env.Enable_MQ="$(Enable_MQ)" \
            --set-string env.GCP_PROJECT_ID="$(GCP_PROJECT_ID)" \
            --set-string env.PUBSUB_TOPIC_ID="$(PUBSUB_TOPIC_ID)" \
            --set-string ALLOYDB_HOST_ALIAS_IP="$(ALLOYDB_HOST_ALIAS_IP)" \
            --set-string ALLOYDB_HOST_ALIAS_NAME="$(ALLOYDB_HOST_ALIAS_NAME)" \
            --set-string ALLOYDB_INSTANCE="projects/$(GCP_PROJECT_ID)/locations/$(GCP_REGION)/clusters/wwrr-${{ parameters.environment }}-alloydb/instances/primary"

          echo "Helm deployment completed successfully"

          echo "Installing kube-prometheus-stack..."

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
          helm repo update

          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 600s \
            --set global.imageRegistry=$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO) \
            --set prometheusOperator.image.repository=monitoring/prometheus-operator \
            --set prometheusOperator.image.tag=v0.85.0 \
            --set prometheusOperator.admissionWebhooks.create.image.repository=monitoring/kube-webhook-certgen \
            --set prometheusOperator.admissionWebhooks.patch.image.repository=monitoring/kube-webhook-certgen \
            --set prometheusOperator.admissionWebhooks.create.image.tag=1.8.0 \
            --set prometheusOperator.admissionWebhooks.patch.image.tag=1.8.0 \
            --set prometheusOperator.admissionWebhooks.enabled=true \
            --set prometheus.prometheusSpec.image.repository=monitoring/prometheus \
            --set prometheus.prometheusSpec.image.tag=v2.52.0 \
            --set alertmanager.alertmanagerSpec.image.repository=monitoring/alertmanager \
            --set alertmanager.alertmanagerSpec.image.tag=v0.27.0 \
            --set grafana.image.repository=monitoring/grafana \
            --set grafana.image.tag=10.4.2 \
            --set grafana.sidecar.image.repository=monitoring/k8s-sidecar \
            --set grafana.sidecar.image.tag=2.6.0 \
            --set kube-state-metrics.image.repository=monitoring/kube-state-metrics \
            --set kube-state-metrics.image.tag=v2.10.1 \
            --set prometheus-node-exporter.image.repository=monitoring/node-exporter \
            --set prometheus-node-exporter.image.tag=v1.11.1 \
            --set prometheusOperator.prometheusConfigReloader.image.repository=monitoring/prometheus-config-reloader \
            --set prometheusOperator.prometheusConfigReloader.image.tag=v0.85.0 \
            --set grafana.grafana\\.ini.server.root_url=https://$(GRAFANA_HOST) \
            --set grafana.grafana\\.ini.server.domain=$(GRAFANA_HOST)


          echo "Installing Kiali..."
          helm repo add kiali https://kiali.org/helm-charts 2>/dev/null || true
          helm repo update

          helm upgrade --install kiali-server kiali/kiali-server \
            --namespace istio-system \
            --wait \
            --timeout 300s \
            --set auth.strategy=anonymous \
            --set server.web_root=/ \
            --set external_services.prometheus.url="http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090" \
            --set external_services.grafana.external_url="https://$(GRAFANA_HOST)" \
            --set deployment.image_name="$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(ARTIFACT_REPO)/monitoring/kiali" \
            --set deployment.image_version="v2.24.0" 

          echo "Installing Grafana Ingress..."
          helm upgrade --install grafana-ingress ./manifests/grafana-ingress \
            --namespace istio-system \
            --wait \
            --timeout 300s \
            --set grafana.host=$(GRAFANA_HOST) \
            --set kiali.host=$(KIALI_HOST) \
            --set tls.secretName=$(TLS_SECRET_NAME)

    - task: Bash@3
      displayName: Cleanup
      condition: always()
      inputs:
        targetType: inline
        script: |

          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          free -h