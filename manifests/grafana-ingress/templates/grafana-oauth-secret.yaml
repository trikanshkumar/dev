apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth-secret
  namespace: monitoring
type: Opaque
stringData:
  GF_AUTH_AZUREAD_CLIENT_ID: "{{ .Values.grafana.clientId }}"
  GF_AUTH_AZUREAD_CLIENT_SECRET: "{{ .Values.grafana.clientSecret }}"
  GF_AUTH_AZUREAD_AUTH_URL: "https://login.microsoftonline.com/{{ .Values.grafana.tenantId }}/oauth2/v2.0/authorize"
  GF_AUTH_AZUREAD_TOKEN_URL: "https://login.microsoftonline.com/{{ .Values.grafana.tenantId }}/oauth2/v2.0/token"
  GF_AUTH_AZUREAD_ALLOWED_DOMAINS: "ups.com"