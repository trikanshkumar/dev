{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ups-wwrr-batch.serviceAccountName" . }}
{{- if and .Values.serviceAccount.annotations (gt (len .Values.serviceAccount.annotations) 0) }}
  annotations:
{{ toYaml .Values.serviceAccount.annotations | indent 4 }}
{{- end }}
{{- end }}