apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: monitoring-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: monitoring-cert-{{ .Values.global.environment }}
    hosts:
    - grafana-wwrr-{{ .Values.global.environment }}.ams1907.com
    - kiali-wwrr-{{ .Values.global.environment }}.ams1907.com
    - prometheus-wwrr-{{ .Values.global.environment }}.ams1907.com