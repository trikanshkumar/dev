# cloudbuild.yaml — Google Cloud Build pipeline for wwrr-mod-app-data-load
#
# Required substitution variables (set in Cloud Build trigger or --substitutions flag):
#   _REGION         : GCP region where Artifact Registry lives, e.g. us-east4
#   _GCP_PROJECT_ID : GCP project ID, e.g. gcp-cti-wwrr-dev
#   _ARTIFACT_REPO  : Artifact Registry repository name, e.g. wwrr-dev-docker-repo
#   _IMAGE_NAME     : Image name, e.g. wwrr-mod-app-data-load
#
# The fully-qualified image pushed:
#   ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$SHORT_SHA
#   ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest

substitutions:
  _REGION: us-east4
  _GCP_PROJECT_ID: project-a4f4c96e-a691-4c2f-8f7
  _ARTIFACT_REPO: dev-docker-repo
  _IMAGE_NAME: app-data-load

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── 1. Build the container image ────────────────────────────────────────────
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest
      - .

  # ── 2. Push the SHA-tagged image ────────────────────────────────────────────
  - id: docker-push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$SHORT_SHA

  # ── 3. Push the 'latest' tag ────────────────────────────────────────────────
  - id: docker-push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest

# Tell Cloud Build which images were produced so they appear in the build summary
# and are subject to the configured image retention / vulnerability scanning policy.
images:
  - ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest

# Build timeout – increase if the .NET restore/publish step is slow.
timeout: 1800s   # 30 minutes